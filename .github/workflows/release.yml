name: Build and qualify native Python release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the optional native compiler and its matching numerical bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnuradio python3-numpy python3-yaml
          python -m pip install build pytest numpy PyYAML playwright
          python -m playwright install --with-deps chromium
      - name: Check release tag and package version
        run: |
          python - <<'PY'
          import os,tomllib
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          ref=os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref == 'refs/tags/v'+version, (ref,version)
          PY
      - name: Build the browser editor and verified WebAssembly/Pyodide assets
        run: python scripts/build_world.py --output "$RUNNER_TEMP/world-assets"
      - name: Build complete Python wheel and source archive
        run: python scripts/build_release.py --assets "$RUNNER_TEMP/world-assets" --output dist
      - name: Exercise installed wheel, browser DSP and native AMS-GRA export without Docker
        run: |
          python scripts/qualify_native_install.py \
            --wheel dist/rf_skill_harness-*-py3-none-any.whl \
            --native-python /usr/bin/python3 --output "$RUNNER_TEMP/native-qualification"
      - name: Native launcher, archive and interpreter isolation tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_native_install.py tests/test_world.py tests/test_world_launcher.py -q
      - name: Publish qualified release files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          GNU Radio World RF skill workbench, installable with pip or uv.
          The wheel and source archive bundle the browser editor, WebAssembly DSP,
          Pyodide, NumPy and SciPy assets. No Docker or Node installation is needed
          to run the release. Native test/export additionally needs local GNU Radio.
          See docs/install.md in the repository for installation and launch commands.

          Qualified from a fresh Python environment using real browser RX/TX DSP,
          capture switching, native GNU Radio testing and RF MEL/UCI source export.
          Live AirSim receiver-tcp-v2 integration is not established by this release.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "RF Skill Harness $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS scripts/install.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-python-release
          path: |
            dist/
            ${{ runner.temp }}/native-qualification/
