name: Qualify GNU Radio RF skill harness
on:
  push:
    branches: [main, feature/gnuradio-companion]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rf-skill-harness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.companion
          load: true
          tags: rf-companion-browser:test
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=companion-browser
          cache-to: type=gha,mode=max,scope=companion-browser
      - name: Install the browser test client
        run: |
          python -m pip install numpy playwright
          python -m playwright install --with-deps chromium
      - name: Edit, preview RX/TX, export and reconnect through Chromium and noVNC
        run: python scripts/qualify_companion_browser.py --image rf-companion-browser:test --output "$RUNNER_TEMP/browser-qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-browser-qualification
          path: ${{ runner.temp }}/browser-qualification
  companion-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Radio's matching compiler and bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnuradio python3-numpy python3-yaml
      - name: Export a capture-free TX/RX flowgraph
        env:
          PYTHONPATH: src
        run: /usr/bin/python3 scripts/prepare_companion_fixture.py --output "$RUNNER_TEMP/companion-skill"
      - uses: docker/setup-buildx-action@v3
      - name: Compile exported GNU Radio and native RF MEL TX/RX
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/companion-skill
          target: native-test
          load: true
          tags: companion-native:test
          build-args: BUILD_NATIVE_FIXTURE=ON
          cache-from: type=gha,scope=companion-native
          cache-to: type=gha,mode=max,scope=companion-native
      - name: Verify native TX samples, schedule, RX DSP, timestamps and OWP offline
        run: docker run --rm --network none -e QT_QPA_PLATFORM=offscreen companion-native:test --expect-transmit
  native-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - name: Prepare an eight-antenna native contract fixture
        run: |
          python -m pip install -e .
          python scripts/prepare_native_fixture.py --output "$RUNNER_TEMP/native-skill"
      - name: Compile the exported native RF MEL and UCI host
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/native-skill
          target: native-test
          load: true
          tags: native-rf-skill:test
          build-args: BUILD_NATIVE_FIXTURE=ON
          cache-from: type=gha,scope=native-export
          cache-to: type=gha,mode=max,scope=native-export
      - name: Run native factories, RX jobs, callbacks, coherent DSP and UCI/OWP offline
        run: docker run --rm --network none native-rf-skill:test --expect-signal
      - name: Extract external native interface fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/native-fixtures"
          container=$(docker create native-rf-skill:test)
          docker cp "$container:/build/build/libtest_mel.so" "$RUNNER_TEMP/native-fixtures/libtest_mel.so"
          docker cp "$container:/build/build/owp_fixture" "$RUNNER_TEMP/native-fixtures/owp_fixture"
          docker cp "$container:/build/native/qualify_native.py" "$RUNNER_TEMP/native-fixtures/qualify_native.py"
          docker rm "$container"
          chmod -R a+rX "$RUNNER_TEMP/native-fixtures"
      - name: Build the exported production runtime
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/native-skill
          target: runtime
          load: true
          tags: native-rf-skill:production
          build-args: BUILD_NATIVE_FIXTURE=ON
          cache-from: type=gha,scope=native-export
          cache-to: type=gha,mode=max,scope=native-export
      - name: Qualify the production binary and unprivileged production user offline
        run: |
          docker run --rm --network none --entrypoint python3 \
            --mount "type=bind,src=$RUNNER_TEMP/native-fixtures,dst=/qualification,readonly" \
            native-rf-skill:production /qualification/qualify_native.py \
            --bundle /opt/skill --build-dir /qualification \
            --executable /usr/local/bin/rf-skill --expect-signal
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build this repository's GNU Radio CPU runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rf-skill-harness:test
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Native GNU Radio, Companion, notebook, plotting and receiver metadata tests
        run: |
          docker run --rm --network none -e QT_QPA_PLATFORM=offscreen \
            --entrypoint timeout rf-skill-harness:test 180 \
            python3 -m pytest /opt/rf-skill-harness/tests -q -p no:cacheprovider
      - name: Host launcher and installed-wheel replay without source mounts
        run: |
          docker run --rm --network none --entrypoint python3 rf-skill-harness:test \
            /opt/rf-skill-harness/scripts/qualify.py
          bash scripts/run_harness.sh --image rf-skill-harness:test --no-pull \
            demo --kind radar --output "$RUNNER_TEMP/harness-demo"
          bash scripts/run_harness.sh --image rf-skill-harness:test --no-pull \
            inspect "$RUNNER_TEMP/harness-demo" --verify
          bash scripts/run_harness.sh --image rf-skill-harness:test --no-pull \
            prepare "$RUNNER_TEMP/harness-demo" --output "$RUNNER_TEMP/harness-project"
          bash scripts/run_harness.sh --image rf-skill-harness:test --no-pull \
            run "$RUNNER_TEMP/harness-demo" \
            --processor "$RUNNER_TEMP/harness-project/processor.py:process_window" \
            --output "$RUNNER_TEMP/harness-results"
          bash scripts/run_harness.sh --image rf-skill-harness:test --no-pull \
            plot "$RUNNER_TEMP/harness-results" --output "$RUNNER_TEMP/harness-plots"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          summary=json.loads((root/'harness-results/run.json').read_text())
          assert summary['status']=='complete' and summary['windows']==6
          assert (root/'harness-project/timeline.html').is_file()
          assert (root/'harness-project/analysis.ipynb').is_file()
          assert (root/'harness-plots/results.png').stat().st_size>1000
          project=json.loads((root/'harness-project/project.json').read_text())
          assert (root/'harness-project'/project['recording_dir']).resolve()==(root/'harness-demo').resolve()
          PY
      # Public releases are built from a pinned commit of this repository by
      # airsim-rf/.github/workflows/rf-skill-harness.yml. Reusing its established
      # public GHCR package avoids a separate private-by-default package.
